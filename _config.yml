title: BashQuest
description: "Interactive terminal game teaching Linux and Bash: 61 levels from ls to kernel builds and desktop ricing"
remote_theme: just-the-docs/just-the-docs

color_scheme: dark
search_enabled: true
permalink: pretty

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "BashQuest &middot; GPL-3.0 &middot; <a href='https://hardlygospel.github.io'>hardlygospel.github.io</a>"

aux_links:
  "← Homepage":
    - "https://hardlygospel.github.io"
  "GitHub":
    - "https://github.com/hardlygospel/bashquest"
  "Download":
    - "https://raw.githubusercontent.com/hardlygospel/bashquest/main/bashquest.sh"

aux_links_new_tab: true

callouts_level: quiet
callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  mac:
    title: macOS Note
    color: purple

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

# README.md has no front matter (it's the GitHub-facing landing page, kept
# free of Jekyll/kramdown syntax so it renders cleanly on github.com).
# index.md is the actual Jekyll homepage, exclude the duplicate from the build.
exclude:
  - README.md
